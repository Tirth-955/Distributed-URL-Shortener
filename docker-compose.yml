services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_DB: urlshortener
    ports:
      # Exposed on 5433 (host) for inspection with psql/GUI tools only.
      # The app always talks to postgres over the internal network.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner: starts, applies migrations, exits.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener
      DATABASE_SSL: "false"
      BASE_URL: http://localhost:8080
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener
      DATABASE_SSL: "false"
      BASE_URL: http://localhost:8080
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No ports here on purpose: the app is only reachable through nginx.
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
