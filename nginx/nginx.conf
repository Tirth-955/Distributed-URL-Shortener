worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. `valid=10s` makes nginx re-resolve the "app"
    # hostname every 10 seconds, so scaled replicas are picked up and
    # stopped instances are dropped. Without this, nginx caches one IP
    # forever and round-robin silently stops working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Basic hardening + sane timeouts for proxied traffic.
    server_tokens off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    server {
        listen 80;

        location / {
            # Variable upstream: nginx re-resolves "app" per TTL above and
            # balances across every IP Docker DNS returns (one per replica).
            set $upstream http://app:3000;

            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
